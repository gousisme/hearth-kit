<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>OldGameSite — free PC games</title>
<!-- FIXTURE: a deliberately ugly "original site" used to demo and test the kit. It is a tiny SPA (pushState routing),
     so it exercises the same things a real target will: list scraping, detail pages, SPA navigation, late rendering. -->
<style>
body{font:14px Verdana,sans-serif;background:#e8e8d8;margin:0}#wrap{width:860px;margin:0 auto;background:#fff;padding:12px;border:2px solid #888}
h1{background:#336;color:#ff0;margin:0 0 8px;padding:6px;font-size:22px}table{width:100%;border-collapse:collapse}th{background:#ccc;text-align:left}
td,th{border:1px solid #aaa;padding:3px 6px}a{color:#00c}tr:nth-child(even){background:#f4f4ea}.dl-link{background:#f80;color:#fff;padding:4px 8px;text-decoration:none}
</style></head><body>
<div id="wrap"><h1>OldGameSite — FREE PC GAMES!!!</h1><div id="app">Loading…</div></div>
<script>
const GAMES=[{"id": "elden", "title": "Elden Ring", "steamAppId": 1245620, "tagline": "Action RPG", "description": "Rise, Tarnished, and be guided by grace to brandish the power of the Elden Ring across the Lands Between.", "genres": ["Open World", "Souls-like", "Fantasy"], "developer": "FromSoftware", "releaseYear": 2022, "size": "60 GB", "rating": "Very Positive"}, {"id": "bg3", "title": "Baldur's Gate 3", "steamAppId": 1086940, "tagline": "CRPG", "description": "Gather your party and return to the Forgotten Realms in a tale of fellowship, betrayal and the lure of absolute power.", "genres": ["Party-Based", "Story Rich", "Fantasy"], "developer": "Larian Studios", "releaseYear": 2023, "size": "150 GB", "rating": "Overwhelmingly Positive"}, {"id": "hades", "title": "Hades", "steamAppId": 1145360, "tagline": "Roguelike", "description": "Defy the god of the dead as you hack and slash out of the Underworld in this rogue-like dungeon crawler.", "genres": ["Action", "Indie", "Mythology"], "developer": "Supergiant Games", "releaseYear": 2020, "size": "15 GB", "rating": "Overwhelmingly Positive"}, {"id": "hk", "title": "Hollow Knight", "steamAppId": 367520, "tagline": "Metroidvania", "description": "Descend into a vast, ruined kingdom of insects and heroes in this hand-drawn action adventure.", "genres": ["2D", "Atmospheric", "Indie"], "developer": "Team Cherry", "releaseYear": 2017, "size": "9 GB", "rating": "Overwhelmingly Positive"}, {"id": "cp", "title": "Cyberpunk 2077", "steamAppId": 1091500, "tagline": "Action RPG", "description": "An open-world action-adventure story set in Night City, a megalopolis obsessed with power and body modification.", "genres": ["Open World", "Sci-fi", "Futuristic"], "developer": "CD PROJEKT RED", "releaseYear": 2020, "size": "70 GB", "rating": "Very Positive"}, {"id": "stardew", "title": "Stardew Valley", "steamAppId": 413150, "tagline": "Farming Sim", "description": "Inherit your grandfather’s old farm plot and build a new life in the countryside.", "genres": ["Cozy", "Pixel Art", "Co-op"], "developer": "ConcernedApe", "releaseYear": 2016, "size": "1 GB", "rating": "Overwhelmingly Positive"}, {"id": "celeste", "title": "Celeste", "steamAppId": 504230, "tagline": "Platformer", "description": "Help Madeline survive her inner demons on her journey to the top of Celeste Mountain.", "genres": ["Precision", "Story Rich", "Pixel Art"], "developer": "Maddy Makes Games", "releaseYear": 2018, "size": "1.2 GB", "rating": "Overwhelmingly Positive"}, {"id": "disco", "title": "Disco Elysium", "steamAppId": 632470, "tagline": "RPG", "description": "A groundbreaking role playing game. You’re a detective with a unique skill system at your disposal.", "genres": ["Detective", "Choices Matter", "Dark"], "developer": "ZA/UM", "releaseYear": 2019, "size": "20 GB", "rating": "Very Positive"}, {"id": "ds3", "title": "Dark Souls III", "steamAppId": 374320, "tagline": "Action RPG", "description": "As fires fade and the world falls into ruin, journey into a universe filled with colossal enemies.", "genres": ["Souls-like", "Difficult", "Dark Fantasy"], "developer": "FromSoftware", "releaseYear": 2016, "size": "25 GB", "rating": "Very Positive"}, {"id": "witcher", "title": "The Witcher 3", "steamAppId": 292030, "tagline": "Action RPG", "description": "Become a monster slayer for hire and embark on an epic journey to find the child of prophecy.", "genres": ["Open World", "Story Rich", "Fantasy"], "developer": "CD PROJEKT RED", "releaseYear": 2015, "size": "50 GB", "rating": "Overwhelmingly Positive"}, {"id": "sekiro", "title": "Sekiro: Shadows Die Twice", "steamAppId": 814380, "tagline": "Action", "description": "Carve your own clever path to vengeance in an Sengoku-era Japan reimagined by FromSoftware.", "genres": ["Ninja", "Difficult", "Samurai"], "developer": "FromSoftware", "releaseYear": 2019, "size": "25 GB", "rating": "Very Positive"}, {"id": "terraria", "title": "Terraria", "steamAppId": 105600, "tagline": "Sandbox", "description": "Dig, fight, explore, build! Nothing is impossible in this action-packed adventure game.", "genres": ["Survival", "Crafting", "Co-op"], "developer": "Re-Logic", "releaseYear": 2011, "size": "300 MB", "rating": "Overwhelmingly Positive"}, {"id": "slay", "title": "Slay the Spire", "steamAppId": 646570, "tagline": "Deckbuilder", "description": "We fused card games and roguelikes together to make the best single player deckbuilder we could.", "genres": ["Roguelike", "Card Game", "Indie"], "developer": "Mega Crit", "releaseYear": 2019, "size": "1 GB", "rating": "Overwhelmingly Positive"}, {"id": "portal", "title": "Portal 2", "steamAppId": 620, "tagline": "Puzzle", "description": "The “Perpetual Testing Initiative” has been expanded to allow you to design co-op puzzles for you and a friend.", "genres": ["Co-op", "Sci-fi", "Comedy"], "developer": "Valve", "releaseYear": 2011, "size": "12 GB", "rating": "Overwhelmingly Positive"}];
const app=document.getElementById('app');
function list(){app.innerHTML='<table class="game-table"><tr><th>Title</th><th>Genre</th><th>Year</th><th>Size</th></tr>'+GAMES.map(g=>
 `<tr class="g" data-id="${g.id}" data-steam="${g.steamAppId}"><td><a class="title" href="/game/${g.id}">${g.title}</a></td><td class="genre">${g.genres.join(', ')}</td><td class="year">${g.releaseYear}</td><td class="size">${g.size}</td></tr>`).join('')+'</table>'}
function detail(id){const g=GAMES.find(x=>x.id===id);if(!g){list();return}
 app.innerHTML=`<article class="detail" data-id="${g.id}"><p><a class="back" href="/">« back to list</a></p><h2 class="d-title">${g.title}</h2>
 <p class="desc">${g.description}</p><dl><dt>Developer</dt><dd class="dev">${g.developer}</dd><dt>Rating</dt><dd class="rating">${g.rating}</dd><dt>Genres</dt><dd class="genres">${g.genres.join(' / ')}</dd><dt>Size</dt><dd class="size">${g.size}</dd><dt>Year</dt><dd class="year">${g.releaseYear}</dd><dt>Steam</dt><dd><a class="steam" href="https://store.steampowered.com/app/${g.steamAppId}/">store page</a></dd></dl>
 <a class="dl-link" href="https://example.com/download/${g.id}">DOWNLOAD NOW</a></article>`}
function route(){const m=location.pathname.match(/^\/game\/([^/]+)/);m?detail(m[1]):list()}
document.addEventListener('click',e=>{const a=e.target.closest('a[href^="/"]');if(a){e.preventDefault();history.pushState({},'',a.getAttribute('href'));setTimeout(route,300)}});
addEventListener('popstate',()=>setTimeout(route,300));
setTimeout(route,400); // late render, like a real SPA
</script></body></html>
